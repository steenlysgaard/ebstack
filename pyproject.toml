[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebstack"
version = "0.1.0"
description = "Layered EasyBuild stack driver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
ebstack = "ebstack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ebstack"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
